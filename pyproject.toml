[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "github-daily-explorer"
version = "0.1.0"
description = "A personal, model-assisted GitHub discovery digest"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.1,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

